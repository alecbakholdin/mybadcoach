name: CI

on:
  push:
    branches:
      - main
      - "integration/**"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Go, buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: bash scripts/install-tools.sh
      - run: npm run lint

  test:
    name: Unit and parity (TypeScript + Go)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: Backend integration (real SQLite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: server/go.sum
      - run: go test ./...
        working-directory: server

  e2e:
    name: Full-stack e2e (docker compose)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The compose definition is the authority: CI runs the same command a
      # developer runs locally and in the devcontainer.
      - run: docker compose build
      - run: docker compose run --rm e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
