<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="data:," />
		<script>
			// Apply a persisted theme before first paint so a light-theme user
			// never sees a dark flash. Keep the key in sync with lib/theme.svelte.ts.
			try {
				var storedTheme = localStorage.getItem('mbc-theme');
				if (storedTheme === 'light' || storedTheme === 'dark') {
					document.documentElement.setAttribute('data-theme', storedTheme);
				}
			} catch {
				// Storage can be unavailable; the default dark theme stands.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
