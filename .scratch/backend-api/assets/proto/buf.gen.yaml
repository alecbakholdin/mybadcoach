# Codegen wiring draft — out paths are placeholders; the implementation effort fixes
# them against the real repo layout (server/ and packages/shared/).
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../../server/internal/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: ../../server/internal/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es
    out: ../../packages/shared/src/gen
    opt: target=ts
