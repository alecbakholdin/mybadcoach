syntax = "proto3";

package mybadcoach.auth.v1;

// AuthService (ticket 04): register, login, logout, me. Sessions are opaque cookie
// sessions (mbc_session, HttpOnly, SameSite=Lax, Secure in prod, 30-day absolute
// expiry). Mutating RPCs outside this service require the X-Requested-With header +
// Origin check for CSRF. bcrypt cost 12; password max 72 bytes (bcrypt truncation).
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
}
